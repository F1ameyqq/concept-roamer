name: Build and prepare release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        with:
          name: concept-roamer-release
          path: |
            dist/concept-roamer/main.js
            dist/concept-roamer/manifest.json
            dist/concept-roamer/styles.css
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concept-roamer-release
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/main.js release-assets/manifest.json release-assets/styles.css --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
